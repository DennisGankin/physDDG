eter model</text><text x="107.6" y="87.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >ties FoldX</text><line x1="162.2" x2="162.2" y1="190" y2="290.0" stroke="#eb6834" stroke-width="1.3"/><g class="hov"><title>TP4: Forward/reverse bias fails</title><circle cx="162.2" cy="190" r="7" fill="#eb6834" stroke="#ffffff" stroke-width="2"/></g><text x="162.2" y="302.0" font-size="12" text-anchor="middle" font-weight="700" fill="#eb6834" >TP4</text><text x="162.2" y="316.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >Forward/reverse</text><text x="162.2" y="329.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >bias fails</text><line x1="227.6" x2="227.6" y1="190" y2="134.0" stroke="#2a78d6" stroke-width="1.3"/><g class="hov"><title>TP5: Repacking pays only for small→large</title><circle cx="227.6" cy="190" r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/></g><text x="227.6" y="104.0" font-size="12" text-anchor="middle" font-weight="700" fill="#2a78d6" >TP5</text><text x="227.6" y="118.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >Repacking pays only</text><text x="227.6" y="131.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >for small→large</text><line x1="293.1" x2="293.1" y1="190" y2="246.0" stroke="#2a78d6" stroke-width="1.3"/><g class="hov"><title>TP6: AlphaFold: flag, don't correct</title><circle cx="293.1" cy="190" r="7" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/></g><text x="293.1" y="258.0" font-size="12" text-anchor="middle" font-weight="700" fill="#2a78d6" >TP6</text><text x="293.1" y="272.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >AlphaFold: flag,</text><text x="293.1" y="285.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1d2430" >don't correct</text><line x1="354.2" x2="354.2" y1="190" y2="134.0" stroke="#2a78d6" stroke-width="1.3"/><g class="hov"><title>TP7: Transfer beats home-