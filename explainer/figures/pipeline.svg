<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="100%" role="img" aria-label="PhysDDG pipeline overview" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif"><rect width="1040" height="270" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs><rect x="4" y="90" width="96" height="80" rx="6" fill="#ffffff" stroke="#4f5a6b"/><text x="52.0" y="118.0" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2430" >Structure</text><text x="52.0" y="135.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2430" >(PDB or AF)</text><text x="52.0" y="152.0" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2430" >+ mutations</text><line x1="100" y1="130" x2="112" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="112.0" y="70" width="132" height="140" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/><text x="122.0" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >1</text><text x="122.0" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Describe each site</text><text x="122.0" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >φ/ψ, helix/strand,</text><text x="122.0" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >burial, contacts</text><text x="122.0" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >(AF: crop, trim)</text><line x1="244.0" y1="130" x2="255.6" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="257.6" y="70" width="132" height="140" rx="6" fill="#eef3fb" stroke="#2a78d6" stroke-width="1.3"/><text x="267.6" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >2</text><text x="267.6" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Build side chains</text><text x="267.6" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >library shapes for</text><text x="267.6" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >wild type AND all</text><text x="267.6" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >19 mutants alike</text><line x1="389.6" y1="130" x2="401.2" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="403.2" y="70" width="132" height="140" rx="6" fill="#eef3fb" stroke="#2a78d6" stroke-width="1.3"/><text x="413.2" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >3</text><text x="413.2" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Score + average</text><text x="413.2" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >9 physics terms,</text><text x="413.2" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >Boltzmann average;</text><text x="413.2" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >stage 2: neighbours</text><text x="413.2" y="184.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >can also move</text><line x1="535.2" y1="130" x2="546.8" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="548.8" y="70" width="132" height="140" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/><text x="558.8" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >4</text><text x="558.8" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Add PDB statistics</text><text x="558.8" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >environment, Rama,</text><text x="558.8" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >cavity, N-cap,</text><text x="558.8" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >helix dipole</text><line x1="680.8" y1="130" x2="692.4" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="694.4" y="70" width="132" height="140" rx="6" fill="#eef3fb" stroke="#2a78d6" stroke-width="1.3"/><text x="704.4" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >5</text><text x="704.4" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Weighted sum</text><text x="704.4" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >41 numbers fitted</text><text x="704.4" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >on 216k Megascale</text><text x="704.4" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >measurements</text><line x1="826.4" y1="130" x2="838.0" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><rect x="840.0" y="70" width="132" height="140" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.3"/><text x="850.0" y="92.0" font-size="15" text-anchor="start" font-weight="700" fill="#2a78d6" >6</text><text x="850.0" y="112.0" font-size="12" text-anchor="start" font-weight="600" fill="#1d2430" >Report + flag</text><text x="850.0" y="136.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >ΔΔG, per-term</text><text x="850.0" y="152.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >parts, flags;</text><text x="850.0" y="168.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >AF: withhold</text><text x="850.0" y="184.0" font-size="11" text-anchor="start" font-weight="400" fill="#4f5a6b" >pLDDT &lt; 70 etc.</text><line x1="972.0" y1="130" x2="984.0" y2="130" stroke="#8a93a3" stroke-width="1.5" marker-end="url(#ar)"/><text x="988.0" y="126.0" font-size="13" text-anchor="start" font-weight="700" fill="#1d2430" >ΔΔG</text><text x="988.0" y="142.0" font-size="10.5" text-anchor="start" font-weight="400" fill="#4f5a6b" >kcal/mol</text><path d="M257.6,60 v-8 H535.2 v8" fill="none" stroke="#8a93a3"/><text x="396.4" y="46.0" font-size="11" text-anchor="middle" font-weight="400" fill="#4f5a6b" >per site, all 20 amino acids at once, batched on GPU</text><text x="520.0" y="250.0" font-size="11" text-anchor="middle" font-weight="400" fill="#4f5a6b" >Shaded steps hold the parts that differ most from FoldX: symmetric wild-type modelling, ensemble averaging, data-fitted weights.</text></svg>